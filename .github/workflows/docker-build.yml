name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
      - test
      - staging
      - prod
    branches-ignore:
      - main
    paths:
      - 'docker/**'
      - '.github/workflows/docker-build.yml'

env:
  AWS_REGION: us-east-1

jobs:
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout infrastructure repo
      uses: actions/checkout@v4
      path: infra

    - name: Checkout application repo
      uses: actions/checkout@v4
      with:
        repository: red9inja/red9inja-GPT
        path: app

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set environment
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        echo "ENVIRONMENT=$BRANCH_NAME" >> $GITHUB_ENV
        echo "IMAGE_TAG=$BRANCH_NAME-${{ github.sha }}" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        cd app
        docker build -t red9inja-gpt:${{ env.IMAGE_TAG }} -f ../infra/docker/Dockerfile .

    - name: Tag and push image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: red9inja-gpt
      run: |
        docker tag red9inja-gpt:${{ env.IMAGE_TAG }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}
        docker tag red9inja-gpt:${{ env.IMAGE_TAG }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.ENVIRONMENT }}-latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.ENVIRONMENT }}-latest

    - name: Update Kubernetes deployment
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name red9inja-gpt-${{ env.ENVIRONMENT }}
        kubectl set image deployment/red9inja-gpt gpt-model=${{ steps.login-ecr.outputs.registry }}/red9inja-gpt:${{ env.IMAGE_TAG }}
        kubectl rollout status deployment/red9inja-gpt
