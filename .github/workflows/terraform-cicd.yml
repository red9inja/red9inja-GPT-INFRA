name: Terraform CI/CD

on:
  push:
    branches:
      - dev
      - test
      - staging
      - prod
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - test
          - staging
          - prod
  repository_dispatch:
    types: [trigger-deployment]

env:
  TF_VERSION: 1.6.0
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Set environment variables
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          BRANCH_NAME=${{ github.event.inputs.environment }}
        elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
          BRANCH_NAME=${{ github.event.client_payload.environment }}
        else
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
        fi
        echo "ENVIRONMENT=$BRANCH_NAME" >> $GITHUB_ENV
        echo "CLUSTER_NAME=red9inja-gpt-$BRANCH_NAME" >> $GITHUB_ENV

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Format Check
      working-directory: ./terraform
      run: terraform fmt -check
      continue-on-error: true

    - name: Terraform Validate
      working-directory: ./terraform
      run: terraform validate

    - name: Terraform Plan
      working-directory: ./terraform
      run: |
        terraform plan \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="cluster_name=${{ env.CLUSTER_NAME }}" \
          -out=tfplan

    - name: Terraform Apply
      if: github.event_name == 'push'
      working-directory: ./terraform
      run: terraform apply -auto-approve tfplan

    - name: Get EKS cluster info
      if: github.event_name == 'push'
      run: |
        echo "Cluster Name: ${{ env.CLUSTER_NAME }}"
        aws eks describe-cluster --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Configure kubectl
      if: github.event_name == 'push'
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

    - name: Deploy to Kubernetes
      if: github.event_name == 'push'
      run: |
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/hpa.yaml

    - name: Wait for deployment
      if: github.event_name == 'push'
      run: |
        kubectl rollout status deployment/red9inja-gpt --timeout=10m

    - name: Get service endpoint
      if: github.event_name == 'push'
      run: |
        kubectl get service red9inja-gpt-service
