name: Update Cloudflare DNS

on:
  workflow_run:
    workflows: ["Terraform CI/CD"]
    types:
      - completed
    branches:
      - dev
      - test
      - staging
      - prod

env:
  DOMAIN: vmind.online

jobs:
  update-dns:
    name: Update Cloudflare DNS Record
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Get environment from branch
      id: env
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        echo "environment=$BRANCH_NAME" >> $GITHUB_OUTPUT
        
        # Set subdomain based on branch
        if [ "$BRANCH_NAME" == "prod" ]; then
          echo "subdomain=gpt" >> $GITHUB_OUTPUT
        else
          echo "subdomain=$BRANCH_NAME" >> $GITHUB_OUTPUT
        fi

    - name: Get Load Balancer DNS
      id: alb
      run: |
        CLUSTER_NAME="red9inja-gpt-${{ steps.env.outputs.environment }}"
        
        # Wait for service to be ready
        aws eks update-kubeconfig --region us-east-1 --name $CLUSTER_NAME
        
        # Get load balancer hostname
        LB_HOSTNAME=$(kubectl get service red9inja-gpt-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        
        if [ -z "$LB_HOSTNAME" ]; then
          echo "Load balancer not ready yet"
          exit 1
        fi
        
        echo "hostname=$LB_HOSTNAME" >> $GITHUB_OUTPUT
        echo "Load Balancer: $LB_HOSTNAME"

    - name: Update Cloudflare DNS
      uses: rez0n/create-dns-record@v2.1
      with:
        type: "CNAME"
        name: "${{ steps.env.outputs.subdomain }}"
        content: "${{ steps.alb.outputs.hostname }}"
        ttl: 1
        proxied: true
        token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        zone: ${{ env.DOMAIN }}

    - name: Enable Cloudflare Security Features
      run: |
        ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=${{ env.DOMAIN }}" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" | jq -r '.result[0].id')
        
        echo "Zone ID: $ZONE_ID"
        
        # Enable Always Use HTTPS
        curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/always_use_https" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"value":"on"}'
        
        # Enable Automatic HTTPS Rewrites
        curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/automatic_https_rewrites" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"value":"on"}'
        
        # Set SSL to Full
        curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"value":"full"}'
        
        # Enable Bot Fight Mode
        curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/bot_fight_mode" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"value":"on"}'
        
        # Set Security Level to Medium
        curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/security_level" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"value":"medium"}'
        
        # Enable Browser Integrity Check
        curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/browser_check" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"value":"on"}'
        
        echo "Cloudflare security features enabled!"

    - name: DNS Updated
      run: |
        echo "DNS record updated successfully!"
        echo "Domain: ${{ steps.env.outputs.subdomain }}.${{ env.DOMAIN }}"
        echo "Points to: ${{ steps.alb.outputs.hostname }}"
        echo ""
        echo "Access your application at:"
        echo "https://${{ steps.env.outputs.subdomain }}.${{ env.DOMAIN }}"
