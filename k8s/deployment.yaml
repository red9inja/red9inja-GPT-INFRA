apiVersion: apps/v1
kind: Deployment
metadata:
  name: red9inja-gpt
  namespace: default
  labels:
    app: red9inja-gpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: red9inja-gpt
  template:
    metadata:
      labels:
        app: red9inja-gpt
    spec:
      nodeSelector:
        workload: gpu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: user-data
        persistentVolumeClaim:
          claimName: user-data-pvc
      containers:
      - name: gpt-model
        image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/red9inja-gpt:latest
        ports:
        - containerPort: 8000
          name: api
        - containerPort: 7860
          name: web
        volumeMounts:
        - name: user-data
          mountPath: /app/user_data
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        env:
        - name: MODEL_SIZE
          value: "small"
        - name: MAX_BATCH_SIZE
          value: "32"
        - name: DEVICE
          value: "cuda"
        - name: AWS_REGION
          value: "us-east-1"
        - name: COGNITO_USER_POOL_ID
          valueFrom:
            secretKeyRef:
              name: cognito-secrets
              key: user-pool-id
        - name: COGNITO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: cognito-secrets
              key: client-id
        - name: DYNAMODB_CONVERSATIONS_TABLE
          value: "CLUSTER_NAME-conversations"
        - name: DYNAMODB_MESSAGES_TABLE
          value: "CLUSTER_NAME-messages"
        - name: REDIS_HOST
          value: "REDIS_ENDPOINT"
        - name: REDIS_PORT
          value: "6379"
        - name: SQS_QUEUE_URL
          value: "SQS_QUEUE_URL"
        - name: RATE_LIMIT_PER_MINUTE
          value: "60"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
