apiVersion: v1
kind: ConfigMap
metadata:
  name: red9inja-gpt-config
  namespace: default
data:
  model_config.yaml: |
    model_size: small
    max_seq_len: 512
    batch_size: 32
    temperature: 0.8
    top_k: 50
    top_p: 0.95
  
  api_config.yaml: |
    host: 0.0.0.0
    port: 8000
    workers: 4
    timeout: 300
    max_requests: 1000
